syntax = "proto3";

package solid.v1;

message UserProfileMsg {
  string sub = 1;
  string username = 2;
  string name = 3;
  string email = 4;
  string idp_role = 5;
  string role_override = 6;
  string simulated_role = 7;
  string namespace = 8;
  repeated string group_grants = 9;
  repeated string disabled_groups = 10;
  bool disable_owner_bypass = 11;
  string created_at = 12;
  string updated_at = 13;
}

message GroupNamespaceMsg {
  string name = 1;
  string parent = 2;
  string owner = 3;
  string description = 4;
  string created_at = 5;
  string updated_at = 6;
}

message GroupMemberMsg {
  string group = 1;
  string username = 2;
  string display_name = 3;
  string user_sub = 4;
  repeated string rights = 5;
  string assigned_by = 6;
  string created_at = 7;
  string updated_at = 8;
}

message DbUserMsg {
  string username = 1;
  repeated string roles = 2;
  string level = 3;
}

message ProvisionUserRequest {
  string sub = 1;
  string username = 2;
  string name = 3;
  string email = 4;
  string role = 5;
  string namespace = 6;
}

message GetUserRequest {
  string sub_or_username = 1;
}

message ListUsersRequest {
  int32 limit = 1;
}

message ListUsersResponse {
  repeated UserProfileMsg users = 1;
}

message AssignPlatformRoleRequest {
  string sub_or_username = 1;
  string role = 2;
  bool as_override = 3;
}

message DeleteUserRequest {
  string sub_or_username = 1;
}

message DeleteResponse {
  bool success = 1;
  string message = 2;
}

message CreateGroupRequest {
  string name = 1;
  string owner = 2;
  string description = 3;
}

message ListGroupsRequest {}

message ListGroupsResponse {
  repeated GroupNamespaceMsg groups = 1;
}

message AssignGroupMemberRequest {
  string group_name = 1;
  string username = 2;
  repeated string rights = 3;
  string assigned_by = 4;
}

message RemoveGroupMemberRequest {
  string group_name = 1;
  string username = 2;
}

message ProvisionDbUserRequest {
  string username = 1;
  string password = 2;
  repeated string roles = 3;
}

message ListDbUsersRequest {}

message ListDbUsersResponse {
  repeated DbUserMsg users = 1;
}

service UserProvisioningService {
  rpc ProvisionUser(ProvisionUserRequest) returns (UserProfileMsg);
  rpc GetUser(GetUserRequest) returns (UserProfileMsg);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc AssignPlatformRole(AssignPlatformRoleRequest) returns (UserProfileMsg);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteResponse);

  rpc CreateGroup(CreateGroupRequest) returns (GroupNamespaceMsg);
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  rpc AssignGroupMember(AssignGroupMemberRequest) returns (GroupMemberMsg);
  rpc RemoveGroupMember(RemoveGroupMemberRequest) returns (DeleteResponse);

  rpc ProvisionDbUser(ProvisionDbUserRequest) returns (DbUserMsg);
  rpc ListDbUsers(ListDbUsersRequest) returns (ListDbUsersResponse);
}
